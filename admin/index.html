<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Portfolio Admin</title>
  <meta name="theme-color" content="#07070d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link id="font-link" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
  <script type="module" src="../assets/js/admin/app.js"></script>
</head>
<body class="admin">
  <div class="gate" id="gate">
    <div class="gate-card">
      <span class="gate-mark"><i class="fa-solid fa-circle-notch fa-spin"></i></span>
      <p class="muted">Loading…</p>
    </div>
  </div>

  <div class="shell" id="shell" hidden>
    <aside class="side">
      <a class="side-brand" href="../" target="_blank" rel="noopener" title="Open your site">
        <span class="side-mark" id="sideMark">YN</span>
        <span><b>Portfolio</b><small>Admin</small></span>
      </a>
      <nav class="side-nav" id="sideNav" aria-label="Admin sections"></nav>
      <div class="side-foot">
        <a class="side-link" href="../" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i> View site</a>
      </div>
    </aside>

    <div class="main">
      <p class="demo-banner" id="demoBanner" hidden>
        <i class="fa-solid fa-flask"></i>
        <span><b>Demo mode.</b> Firebase isn't connected yet, so changes are saved only in this browser. Follow <b>SETUP.md</b> to go live.</span>
      </p>
      <header class="top">
        <div class="top-title"><h1 id="tabTitle">Dashboard</h1><p id="tabHint" class="muted"></p></div>
        <button class="btn sm" id="pvToggle" type="button"><i class="fa-solid fa-eye"></i><span>Preview</span></button>
      </header>
      <main class="panel" id="panel"></main>
      <div class="savebar" id="savebar">
        <span class="save-state" id="saveState"><i class="fa-solid fa-circle-check"></i> All saved</span>
        <button class="btn sm ghost" id="discardBtn" type="button">Discard</button>
        <button class="btn sm primary" id="saveBtn" type="button"><i class="fa-solid fa-cloud-arrow-up"></i><span>Save &amp; publish</span></button>
      </div>
    </div>

    <section class="pv" id="pv" aria-label="Live preview">
      <div class="pv-bar">
        <b>Live preview</b>
        <div class="seg" role="group" aria-label="Preview size">
          <button type="button" data-pv="desktop" aria-pressed="true"><i class="fa-solid fa-desktop"></i> PC</button>
          <button type="button" data-pv="phone" aria-pressed="false"><i class="fa-solid fa-mobile-screen"></i> Phone</button>
        </div>
        <button class="icon" type="button" id="pvClose" aria-label="Close preview"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="pv-frame" id="pvFrame"><iframe id="pvIframe" title="Site preview"></iframe></div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
